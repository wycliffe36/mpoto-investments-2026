<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MPOTO INVESTMENTS - BARBER</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Arial;font-size:9px;background:#fff;margin:0} table{border-collapse:collapse;width:100%} th,td{border:1px solid #000;padding:2px;text-align:center;font-size:8px;min-width:40px} td:first-child{text-align:left;min-width:140px} input{width:100%;border:none;outline:none;text-align:center;font-size:8px;background:transparent} .yellow{background:#ffff99 !important}.peach{background:#fbe4d5 !important}.blue{background:#c2d8ff !important}.green{background:#c6efce !important}</style>
</head><body>
<div style="display:flex;justify-content:space-between;padding:6px;background:#0f172a;color:#fff"><b>MPOTO INVESTMENTS - BARBER SHOP SERVICES</b><div><a href="index.html" style="background:#fff;color:#000;padding:3px 8px;border-radius:6px">Hub</a> <input type="date" id="start" value="2026-10-04" onchange="render()" style="color:#000;padding:2px;border-radius:6px"><button onclick="exportCSV()" style="background:#22c55e;color:#fff;padding:3px 8px;border-radius:6px;border:none">Export</button></div></div>
<div style="overflow:auto;max-height:92vh"><table id="tbl"></table></div>
<script>
let data=JSON.parse(localStorage.getItem('mp_barber')||'{}');
const svc=[['Shave','50%','100'],['Shave And Wax Beard','50%','200'],['Beard Dry','43%','200'],['Soft Flow','49%','300'],['Black Shampoo (Full Head)','49%','300'],['Cream of Nature (Full Head)','49%','500'],['Cream of Nature','49%','500'],['Nail Plus Ring','49%','200'],['Nail Cut Plus filing','49%','200'],['Cut','49%','100'],['Barber Blowdry','49%','200'],['Face Scrub','49%','200'],['Bleaching','49%','300'],['Waxing','49%','300'],['Moisturizer','49%','300'],['Full Facial','49%','800'],['Toddlers Full','49%','800'],['Chemicals Plus Full','49%','1000'],['Nail Polish','49%','200'],['Body Scrub','49%','1000'],['Full Body Massage','49%','1000'],['Half Body Massage','49%','500'],['Kids Shave','49%','100'],['Hair Wash','49%','100'],['Black & Yellow Dry','49%','400'],['Hair Relaxation','49%','400'],['Bald & Shave','49%','100'],['Shaving Foam','49%','200'],['Basic Dry (Cream of Nature)','49%','400'],['Masks/Caps','49%','200'],['Blow Dry','49%','200'],['DIRTY WASH','49%','500'],['Wash','49%','500'],['Retouch','49%','350']];
const emps=[{n:'CHARLES',c:'yellow'},{n:'DIANA',c:'peach'},{n:'EUNICE',c:'blue'},{n:'PERIS',c:'green'}];
function fmt(d){const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');return `${dd}.${mm}.${d.getFullYear()}`;}
function dayName(d){return ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][d.getDay()];}
function getDates(s){const a=[];const d=new Date(s);for(let i=0;i<3;i++){const n=new Date(d);n.setDate(d.getDate()+i);a.push(n);}return a;}
function render(){
const dates=getDates(document.getElementById('start').value||'2026-10-04');
let h='<tr><th style="background:#f2f2f2;text-align:left">BARBER SHOP SERVICES</th><th></th><th>PRICES</th>';
dates.forEach((dt,idx)=>{if(idx===0)h+=`<th colspan="8" class="yellow">${dayName(dt)}</th><th colspan="4" style="font-size:7px">${fmt(dt)}</th>`;else if(idx===1)h+=`<th colspan="8" class="yellow">MONDAY</th><th colspan="4" style="font-size:7px">${fmt(dt)}</th>`;else h+=`<th colspan="2" class="yellow">TUESDAY</th><th colspan="2" style="font-size:7px">${fmt(dt)}</th>`;});
h+='</tr><tr><th></th><th>Shave</th><th>100.00</th>';dates.forEach(()=>{emps.forEach(e=>{h+=`<th class="${e.c}">${e.n}</th><th class="${e.c}">Comm</th>`;});});h+='</tr><tr><th></th><th></th><th></th>';dates.forEach(()=>{emps.forEach(e=>{h+=`<th class="${e.c}" style="font-size:6px">Sales</th><th class="${e.c}" style="font-size:6px">Comm</th>`;});});h+='</tr>';
svc.forEach((row,rIdx)=>{h+=`<tr><td style="text-align:left">${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td>`;dates.forEach((dt,dIdx)=>{emps.forEach((emp,eIdx)=>{const k=`${rIdx}_${eIdx}_${dIdx}`;const v=data[k]||'';const p=parseInt((row[1]||'0').replace('%',''))||0;const pr=parseFloat(row[2])||0;const com=v && !isNaN(v) && p && pr ? ((Number(v)*pr*p)/100).toFixed(0) : '-';h+=`<td class="${emp.c}"><input data-k="${k}" value="${v}" oninput="data[this.dataset.k]=this.value;localStorage.setItem('mp_barber',JSON.stringify(data));render()" placeholder="-"></td><td class="${emp.c}">${com}</td>`;});});h+='</tr>';});
h+='<tr><td style="text-align:right;font-weight:900">TOTAL</td><td></td><td></td>';dates.forEach((dt,dIdx)=>{emps.forEach((emp,eIdx)=>{let tot=0,com=0;svc.forEach((row,rIdx)=>{const k=`${rIdx}_${eIdx}_${dIdx}`;const v=data[k];if(v && !isNaN(v)){tot+=Number(v);const p=parseInt((row[1]||'0').replace('%',''))||0;const pr=parseFloat(row[2])||0;com+=Number(v)*pr*p/100;}});h+=`<td class="${emp.c}" style="font-weight:900">${tot||'-'}</td><td class="${emp.c}" style="font-weight:900">${com?com.toFixed(0):'-'}</td>`;});});h+='</tr>';
document.getElementById('tbl').innerHTML=h;
}
function exportCSV(){let csv='BARBER SHOP SERVICES,,PRICES\n';svc.forEach((row,rIdx)=>{let line=row[0]+','+row[1]+','+row[2]+',';for(let d=0;d<3;d++){for(let e=0;e<4;e++){const k=`${rIdx}_${e}_${d}`;line+=(data[k]||'-')+',';}}csv+=line+'\n';});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MPOTO_BARBER_'+document.getElementById('start').value+'.csv';a.click();}
render();
</script>
</body></html>
