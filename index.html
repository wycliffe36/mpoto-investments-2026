<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOODPOINT 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body{font-family:system-ui,sans-serif}
.gradient-1{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.gradient-2{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
.gradient-3{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%)}
.gradient-4{background:linear-gradient(135deg,#43e97b 0%,#38f9d7 100%)}
.gradient-5{background:linear-gradient(135deg,#fa709a 0%,#fee140 100%)}
.gradient-7{background:linear-gradient(135deg,#a18cd1 0%,#fbc2eb 100%)}
.date-pill{cursor:pointer;padding:3px 8px;border-radius:9999px;font-size:10px;font-weight:700;background:#e8f0ff;color:#334155;margin:2px;display:inline-block;border:1px solid #cbd5e1}
.date-pill.auto{background:#0f172a;color:white}
.date-pill.active{background:#0f172a;color:white}
</style>
</head><body class="bg-[#f8fafc] min-h-screen">
<header class="sticky top-0 z-50 bg-white border-b"><div class="max-w-[1600px] mx-auto px-4 py-3 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl gradient-1 flex items-center justify-center text-white font-black">FP</div><h1 class="font-black text-[16px]">FOODPOINT 2026</h1></div><div class="flex gap-2"><button onclick="exportExcel()" class="px-3 py-2 bg-black text-white rounded-xl text-xs font-bold">Export</button><button onclick="openDailyModal()" class="px-3 py-2 gradient-1 text-white rounded-xl text-xs font-bold">+ Daily</button></div></div></header>
<div class="max-w-[1600px] mx-auto px-4 py-4 grid grid-cols-12 gap-4">
<div class="col-span-12 lg:col-span-3 space-y-3">
<div class="bg-white rounded-2xl p-3 border"><h3 class="font-black text-[11px] text-slate-400 uppercase mb-2">Modules</h3><div id="categoryButtons" class="grid gap-2"></div></div>
<div class="bg-white rounded-2xl p-3 border"><h3 class="font-bold text-xs mb-2">Filter by Date (Auto)</h3><input id="filterDate" type="date" onchange="filterByDate()" class="w-full px-3 py-2 bg-slate-50 rounded-xl text-sm border font-bold"><div class="grid grid-cols-2 gap-2 mt-2"><select id="filterMonth" onchange="filterByMonthYear()" class="px-2 py-2 bg-slate-50 rounded-xl text-xs font-bold border"><option value="">All Months</option><option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option><option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option><option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option><option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option></select><select id="filterYear" onchange="filterByMonthYear()" class="px-2 py-2 bg-slate-50 rounded-xl text-xs font-bold border"><option value="">All Years</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option></select></div><div id="quickDatePills" class="flex flex-wrap gap-1 mt-2"></div><button onclick="clearDateFilters()" class="w-full mt-2 py-2 bg-slate-100 rounded-xl text-xs font-bold">Clear</button><p class="text-[10px] text-slate-400 mt-2">Dates auto for each product</p></div>
</div>
<div class="col-span-12 lg:col-span-9 space-y-4">
<div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="bg-white rounded-xl p-3 border"><p class="text-[10px] text-slate-400 font-bold uppercase">Products</p><p id="kpiProducts" class="text-xl font-black">187</p></div><div class="bg-white rounded-xl p-3 border"><p class="text-[10px] text-slate-400 font-bold uppercase">Total Sales</p><p id="kpiSales" class="text-xl font-black">KSh 0</p></div><div class="bg-white rounded-xl p-3 border"><p class="text-[10px] text-slate-400 font-bold uppercase">Low Stock</p><p id="kpiLowStock" class="text-xl font-black text-amber-600">0</p></div><div class="bg-white rounded-xl p-3 border"><p class="text-[10px] text-slate-400 font-bold uppercase">Filtered Sales</p><p id="kpiFilteredSales" class="text-xl font-black text-violet-600">KSh 0</p></div></div>
<div class="bg-white rounded-xl p-2 border flex gap-2"><input id="searchInput" oninput="filterProducts()" placeholder="Search..." class="flex-1 px-4 py-2 bg-slate-50 rounded-xl text-sm"><select id="stockFilter" onchange="filterProducts()" class="px-3 py-2 bg-slate-50 rounded-xl text-xs font-bold"><option value="all">All</option><option value="low">Low</option><option value="out">Out</option></select><button onclick="addNewProduct()" class="px-4 py-2 bg-violet-600 text-white rounded-xl text-xs font-bold">+ Add</button></div>
<div class="bg-white rounded-2xl border overflow-hidden"><div class="p-3 flex justify-between border-b"><div class="flex gap-2 items-center"><div id="activeIcon" class="w-8 h-8 rounded-xl gradient-1 flex items-center justify-center text-white"><i class="fas fa-store"></i></div><h2 id="activeTitle" class="font-black">STORE SUPPLIES</h2></div><span id="activeCount" class="text-xs bg-slate-100 px-2 py-1 rounded-full font-bold">0</span></div><div class="overflow-auto max-h-[520px]"><table class="w-full text-sm"><thead class="sticky top-0 bg-slate-50 text-[10px] uppercase font-black text-slate-500"><tr><th class="text-left px-3 py-2 w-[35%]">Product + Auto Dates</th><th class="text-right px-2 py-2">Buy</th><th class="text-right px-2 py-2">Stock</th><th class="text-right px-2 py-2">Sell</th><th class="text-center px-2 py-2">Add</th><th class="text-center px-2 py-2">History</th></tr></thead><tbody id="productTableBody"></tbody></table></div></div>
